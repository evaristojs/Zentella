<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zentella - Agencia Creativa</title>
    
    <!-- Performance optimizations -->
    <link rel="preload" href="/logo-modo-claro.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="/logo-modo-oscuro.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="/isotipo-modo-claro.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="/isotipo-modo-oscuro.svg" as="image" type="image/svg+xml">
    
    <script src="/theme-init.js"></script>
    
    <!-- Font optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6700f8">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
